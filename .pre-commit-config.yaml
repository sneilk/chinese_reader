repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      # Дампы словарей, профиль браузера и SQLite не должны попасть в git даже
      # случайно: .gitignore защищает от привычки, эта проверка — от git add -f.
      - id: check-merge-conflict
      - id: detect-private-key
